name: Build PDF Editor Pro APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install image tooling
        run: python3 -m pip install --user Pillow
      - name: Apply public logo to Android launcher icons
        run: |
          python3 - <<'PYCODE'
          from PIL import Image
          from pathlib import Path
          source = Path('public/pdf.logo.png')
          if not source.is_file():
              raise SystemExit('Missing required logo: public/pdf.logo.png')
          image = Image.open(source).convert('RGB')
          densities = {'mdpi':48, 'hdpi':72, 'xhdpi':96, 'xxhdpi':144, 'xxxhdpi':192}
          for density, size in densities.items():
              folder = Path(f'app/src/main/res/mipmap-{density}')
              folder.mkdir(parents=True, exist_ok=True)
              icon = image.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / 'ic_launcher.webp', 'WEBP', quality=95)
              icon.save(folder / 'ic_launcher_round.webp', 'WEBP', quality=95)
          foreground = Path('app/src/main/res/drawable-nodpi/ic_launcher_foreground.png')
          foreground.parent.mkdir(parents=True, exist_ok=True)
          canvas = Image.new('RGBA', (432, 432), (0, 0, 0, 0))
          artwork = image.convert('RGBA').resize((360, 360), Image.Resampling.LANCZOS)
          canvas.alpha_composite(artwork, (36, 36))
          canvas.save(foreground, optimize=True)
          print('Launcher icons generated from public/pdf.logo.png')
          PYCODE
      - name: Create debug signing key
        run: keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Run unit tests and build debug APK
        run: gradle testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Editor-Pro-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
